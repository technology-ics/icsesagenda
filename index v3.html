<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8C191B">
  <title>Scientific Program | ICSES 2026</title>
  <meta name="description" content="Scientific program for the 16th International Congress on Shoulder and Elbow Surgery, September 22–25, 2026, Vancouver.">
  <style>
:root {
  --earth: #a74424;
  --mint: #67c18c;
  --teal: #4bb3a6;
  --burgundy: #8c191b;
  --ink: #231f20;
  --paper: #f6f1eb;
  --card: #ffffff;
  --line: #e3d6cc;
  --muted: #6a5d57;
  --soft: #fbf8f5;
  --focus: #4bb3a6;
  --danger: #8c191b;
  --radius: 6px;
  --header-offset: 0px;
  --max: 1080px;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; height: auto; }

button,
input,
select {
  font: inherit;
  color: inherit;
}

a {
  color: var(--burgundy);
}

a:hover { color: var(--earth); }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -40px;
  z-index: 30;
  background: var(--ink);
  color: #fff;
  padding: 8px 12px;
}

.skip-link:focus { top: 12px; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.wrap {
  width: min(100% - 32px, var(--max));
  margin-inline: auto;
}

.site-header {
  background: var(--card);
}

.header-inner {
  display: grid;
  gap: 16px;
  padding: 18px 0 16px;
}

.logo-link {
  display: block;
  max-width: 520px;
}

.logo {
  display: block;
  width: min(100%, 520px);
  height: auto;
}

.header-copy h1 {
  margin: 0;
  font-size: clamp(1.45rem, 4vw, 2rem);
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.eyebrow,
.subhead,
.site-link {
  margin: 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--burgundy);
  margin-bottom: 6px;
}

.subhead { margin-top: 4px; }

.site-link {
  display: inline-block;
  margin-top: 10px;
  font-weight: 600;
  text-underline-offset: 3px;
}

.brand-bar {
  display: grid;
  grid-template-columns: 18% 22% 20% 20% 20%;
  height: 6px;
}

.brand-bar span:nth-child(1) { background: var(--ink); }
.brand-bar span:nth-child(2) { background: var(--burgundy); }
.brand-bar span:nth-child(3) { background: var(--earth); }
.brand-bar span:nth-child(4) { background: var(--teal); }
.brand-bar span:nth-child(5) { background: var(--mint); }

.toolbar {
  position: sticky;
  top: 0;
  z-index: 8;
  background: rgba(246, 241, 235, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 12px 0 10px;
}

.search-form input {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid #cbbfb4;
  border-radius: var(--radius);
  background: var(--card);
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-top: 10px;
}

.filter-label,
.filter-label select {
  min-height: 44px;
}

.filter-label select {
  min-width: min(100%, 220px);
  padding: 8px 12px;
  border: 1px solid #cbbfb4;
  border-radius: var(--radius);
  background: var(--card);
}

.text-btn,
.ghost-btn,
.primary-btn,
.icon-btn,
.abs-btn,
.cal-menu button,
.cal-menu a {
  min-height: 44px;
  min-width: 44px;
}

.text-btn {
  border: 0;
  background: none;
  color: var(--burgundy);
  font-weight: 700;
  padding: 8px 4px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.load-status {
  margin: 0 0 0 auto;
  color: var(--muted);
  font-size: 0.82rem;
}

.days {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin-top: 8px;
  overflow: visible;
}

.day {
  appearance: none;
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  border-bottom: 3px solid transparent;
  padding: 10px 12px;
  min-height: 44px;
  cursor: pointer;
  font-weight: 650;
  color: var(--muted);
  white-space: nowrap;
}

.day.active {
  color: var(--ink);
  border-bottom-color: var(--burgundy);
}

.day[aria-pressed="true"] {
  color: var(--ink);
  border-bottom-color: var(--burgundy);
}

.programme { padding: 18px 0 64px; }

.backup-note,
.view-note,
.summary,
.empty {
  color: var(--muted);
}

.backup-note {
  background: #f4ebe3;
  border: 1px solid var(--line);
  padding: 10px 12px;
  border-radius: var(--radius);
  margin-bottom: 14px;
  color: var(--ink);
  font-size: 0.92rem;
}

.view-note {
  margin: 0 0 12px;
  font-size: 0.92rem;
}

.summary { margin: 0 0 14px; font-size: 0.92rem; }

.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 64px 16px;
  color: var(--muted);
}

.loading[hidden] {
  display: none !important;
}

.loading-mark {
  width: 42px;
  height: 42px;
  border: 3px solid var(--line);
  border-top-color: var(--burgundy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.session {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin: 0 0 12px;
}

.session-head {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  padding: 16px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.session-time {
  font-weight: 750;
  font-size: 0.98rem;
  letter-spacing: 0.01em;
}

.day-heading {
  margin: 22px 0 10px;
  font-size: 0.95rem;
  font-weight: 750;
  color: var(--ink);
}

.day-heading:first-child { margin-top: 4px; }

.session-kicker {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  margin: 0 0 6px;
}

.session-type {
  display: block;
  margin: 0;
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--teal);
}

.session-type.type-icl { color: var(--burgundy); }
.session-type.type-symposium { color: var(--earth); }
.session-type.type-eposter { color: #2f7a58; }
.session-type.type-education { color: var(--teal); }

.session-track {
  display: inline-block;
  margin: 0;
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
}

.track-elbow { background: #4bb3a6; color: #231f20; }
.track-cuff { background: #67c18c; color: #231f20; }
.track-arthroplasty { background: #8c191b; }
.track-instability { background: #a74424; }
.track-trauma { background: #a74424; }
.track-international { background: #4bb3a6; color: #231f20; }
.track-basic { background: #231f20; }
.track-nerve { background: #8c191b; }
.track-shoulder { background: #4bb3a6; color: #231f20; }
.track-other { background: #231f20; }

.session h2 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.session-meta,
.chairs {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.status-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: #efe6df;
  color: var(--earth);
}

.status-badge.now {
  background: var(--burgundy);
  color: #fff;
}

.chev {
  color: var(--muted);
  font-size: 1.2rem;
  line-height: 1;
  align-self: center;
  transition: transform 0.15s ease;
}

.session.open .chev { transform: rotate(180deg); }

.session-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 4px 16px 16px;
}

.session.open .session-body { display: block; }

.session-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0 8px;
}

.ghost-btn,
.primary-btn,
.abs-btn,
.cal-menu > button {
  appearance: none;
  border-radius: var(--radius);
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 700;
}

.ghost-btn,
.cal-menu > button {
  border: 1px solid var(--burgundy);
  background: #fff;
  color: var(--burgundy);
}

.ghost-btn[aria-pressed="true"] {
  background: var(--burgundy);
  color: #fff;
}

.primary-btn {
  border: 1px solid var(--burgundy);
  background: var(--burgundy);
  color: #fff;
}

.abs-btn {
  border: 1px solid var(--teal);
  background: #fff;
  color: #1f6f66;
  white-space: nowrap;
}

.cal-menu {
  position: relative;
}

.cal-pop {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 4;
  min-width: 220px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px;
  display: none;
}

.cal-menu.open .cal-pop { display: grid; }

.cal-pop a,
.cal-pop button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 10px 12px;
  cursor: pointer;
  color: var(--ink);
  text-decoration: none;
  font-weight: 650;
}

.cal-pop a:hover,
.cal-pop button:hover { background: var(--soft); }

.presentation {
  display: grid;
  gap: 4px;
  padding: 14px 0;
  border-bottom: 1px solid #efe7e0;
}

.presentation:last-child { border-bottom: 0; }

.pres-time {
  font-weight: 750;
  font-size: 0.92rem;
}

.pres-title {
  font-weight: 700;
  font-size: 1.02rem;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.pres-code {
  color: var(--muted);
  font-size: 0.82rem;
}

.faculty {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}

.faculty li {
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.45;
}

.role-label {
  display: block;
  margin-top: 8px;
  margin-bottom: 2px;
  font-size: 0.68rem;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--burgundy);
}

.role-label:first-child { margin-top: 0; }

.pres-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.empty {
  text-align: center;
  padding: 48px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.empty h2 {
  margin: 0 0 8px;
  color: var(--ink);
}

.mark {
  background: #f3e0c8;
  color: inherit;
  padding: 0 0.1em;
}

.modal[hidden],
.lightbox[hidden] {
  display: none !important;
}

.modal,
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(35, 31, 32, 0.55);
  overflow: auto;
  padding: 16px;
}

.modal-card {
  width: min(100%, 820px);
  margin: 24px auto;
  background: #fff;
  border-radius: 8px;
  padding: 24px 20px 28px;
  position: relative;
}

.modal-close {
  appearance: none;
  border: 0;
  background: transparent;
  position: absolute;
  top: 10px;
  right: 10px;
  min-height: 44px;
  min-width: 44px;
  cursor: pointer;
  font-weight: 700;
  color: var(--ink);
}

.abstract h2 {
  margin: 0 48px 10px 0;
  font-size: 1.35rem;
  line-height: 1.3;
}

.abstract-meta {
  color: var(--muted);
  margin-bottom: 18px;
}

.abstract-body { line-height: 1.6; }

.abstract-body b,
.abstract-body strong {
  display: block;
  margin-top: 1.2rem;
  margin-bottom: 0.3rem;
  font-size: 0.76rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--burgundy);
}

.abstract-body p { margin: 0 0 0.75rem; }

.abstract-body img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 16px auto;
  border: 1px solid var(--line);
  cursor: zoom-in;
}

.abstract-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

.table-wrap { overflow-x: auto; }

.lightbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 16px;
}

.lightbox img {
  max-width: min(100%, 1100px);
  max-height: 82vh;
  width: auto;
  height: auto;
  object-fit: contain;
  background: #fff;
}

.lightbox-caption {
  color: #fff;
  margin: 12px 0 0;
}

@media (min-width: 800px) {
  .header-inner {
    grid-template-columns: minmax(240px, 420px) 1fr;
    align-items: center;
    gap: 28px;
    padding: 22px 0 18px;
  }

  .session-head {
    grid-template-columns: 150px 1fr auto;
    align-items: start;
  }

  .session-time { grid-row: 1 / span 2; }

  .session h2 { font-size: 1.18rem; }

  .faculty-inline {
    display: block;
  }

  .faculty-inline li { display: inline; }
  .faculty-inline li:not(:last-child)::after {
    content: " · ";
    color: #b3a49a;
  }

  .presentation {
    grid-template-columns: 150px 1fr auto;
    gap: 8px 16px;
    align-items: start;
  }

  .pres-time { grid-row: 1 / span 3; }
}

@media (max-width: 430px) {
  .wrap { width: min(100% - 24px, var(--max)); }
  .header-copy h1 { font-size: 1.4rem; }
}

</style>
</head>

/* RFC 4180 CSV parser: quoted commas, escaped quotes, multiline fields, Unicode. */
(function (global) {
  function parseCSV(text) {
    if (text == null) return [];
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);

    const rows = [];
    let row = [];
    let field = "";
    let i = 0;
    let inQuotes = false;

    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i += 2;
            continue;
          }
          inQuotes = false;
          i += 1;
          continue;
        }
        field += c;
        i += 1;
        continue;
      }

      if (c === '"') {
        inQuotes = true;
        i += 1;
        continue;
      }
      if (c === ",") {
        row.push(field);
        field = "";
        i += 1;
        continue;
      }
      if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i += 1;
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
        i += 1;
        continue;
      }
      field += c;
      i += 1;
    }

    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }

    if (!rows.length) return [];

    const headers = rows[0].map(function (h) {
      return String(h || "").trim();
    });

    const objects = [];
    for (let r = 1; r < rows.length; r += 1) {
      const cells = rows[r];
      if (!cells.some(function (cell) { return String(cell || "").trim(); })) continue;
      const obj = {};
      for (let c = 0; c < headers.length; c += 1) {
        if (!headers[c]) continue;
        obj[headers[c]] = cells[c] != null ? cells[c] : "";
      }
      objects.push(obj);
    }
    return objects;
  }

  global.ICSESCsv = { parse: parseCSV };
})(window);

        el.setAttribute("target", "_blank");
      }
    } else if (node.tagName === "TD" || node.tagName === "TH") {
      var colspan = node.getAttribute("colspan");
      var rowspan = node.getAttribute("rowspan");
      if (colspan) el.setAttribute("colspan", colspan);
      if (rowspan) el.setAttribute("rowspan", rowspan);
    }

    Array.prototype.forEach.call(node.childNodes, function (child) {
      var cleaned = copyClean(child);
      if (cleaned) el.appendChild(cleaned);
    });
    return el;
  }

  function sanitizeHtml(html) {
    var template = document.createElement("template");
    template.innerHTML = redactPrivate(html || "");
    var output = document.createElement("div");
    Array.prototype.forEach.call(template.content.childNodes, function (child) {
      var cleaned = copyClean(child);
      if (cleaned) output.appendChild(cleaned);
    });
    output.querySelectorAll("table").forEach(function (table) {
      var wrap = document.createElement("div");
      wrap.className = "table-wrap";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
    return output.innerHTML;
  }

  function isExcludedSession(id, title) {
    var name = normalizeTitle(title);
    if (name === "testing submitter" || name === "education test") return true;
    if (id === "19" || id === "257") return true;
    return false;
  }

  function deriveTrack(type, title) {
    var text = compact(title);
    var lower = text.toLowerCase();
    var kind = compact(type).toLowerCase();
    if (!text) return "";

    if (kind.indexOf("eposter") !== -1) {
      if (/basic science/.test(lower)) return "Basic Science";
      if (/elbow/.test(lower)) return "Elbow";
      if (/rotator cuff/.test(lower)) return "Rotator Cuff";
      if (/arthritis/.test(lower)) return "Shoulder Arthroplasty";
      if (/fracture/.test(lower)) return "Trauma";
      if (/instability/.test(lower)) return "Shoulder Instability";
      if (/neurological|nerve/.test(lower)) return "Nerve";
      if (/shoulder/.test(lower)) return "Shoulder";
      return text;
    }

    if (/international perspectives/.test(lower)) return "International Perspectives";
    if (/\belbow\b|\bdistal humerus\b|\bradial head\b|\bcoronoid\b|\bproximal ulna\b|\btriceps\b|biceps and triceps/.test(lower)) return "Elbow";
    if (/rotator cuff|\bcuff tear|\bcuff surgery|\bcuff:|\bcuff\b/.test(lower)) return "Rotator Cuff";
    if (/arthroplasty|\brtsa\b|\brsa\b|anatomic tsa|stemless|bearing surfaces|component removal|navigation & robotics|pyrocarbon/.test(lower)) return "Shoulder Arthroplasty";
    if (/instability|latarjet|stabilization|bankart/.test(lower)) return "Shoulder Instability";
    if (/fracture|trauma|clavicle|internal fixation|periprosthetic/.test(lower)) return "Trauma";
    if (/scapula|scapulothoracic|\bac joint\b/.test(lower)) return "Shoulder";
    if (/nerve|neurolog|brachial plexus/.test(lower)) return "Nerve";
    return "";
  }

  function transform(rows) {
    var sessions = new Map();
    var sessionOrder = [];

    rows.forEach(function (raw, index) {
      var status = compact(raw["Abstract.PresentationRoleStatus"]).toLowerCase();
      if (status === "declined") return;

      var sessionId = compact(raw["Session.ID"]);
      if (!sessionId) return;
      var sessionTitle = compact(raw["Session.Title"]);
      if (isExcludedSession(sessionId, sessionTitle)) return;

      var session = sessions.get(sessionId);
      if (!session) {
        var parsedDate = parseSessionDateTime(raw["Session.DateRangeUSDateTime"]);
        var type = compact(raw["Session.Type"]);
        var isEposter = /eposter|e-poster/i.test(type);
        session = {
          id: sessionId,
          title: sessionTitle,
          type: type,
          track: deriveTrack(type, sessionTitle),
          dateKey: parsedDate ? parsedDate.dateKey : isEposter ? "eposter" : "",
          dateLabel: "",
          timeLabel: parsedDate && parsedDate.range ? formatRange(parsedDate.range) : "",
          startMinutes: parsedDate && parsedDate.range ? parsedDate.range.start.minutes : 9999,
          endMinutes: parsedDate && parsedDate.range ? parsedDate.range.end.minutes : 9999,
          range: parsedDate ? parsedDate.range : null,
          sourceIndex: index,
          groups: new Map(),
          groupOrder: []
        };
        session.dateLabel = session.dateKey ? formatDayFull(session.dateKey) : "";
        sessions.set(sessionId, session);
        sessionOrder.push(session);
      }

      var key = groupingKey(raw);
      var group = session.groups.get(key);
      if (!group) {
        var timeRange = parseTimeRange(raw["Abstract.PresentationDateRangeUSTimeOnly"]);
        group = {
          key: key,
          title: compact(raw["Abstract.Title"]),
          timeLabel: formatRange(timeRange),
          startMinutes: timeRange ? timeRange.start.minutes : 9999,
          people: [],
          seenPeople: {},
          abstracts: [],
          sourceIndex: index
        };
        session.groups.set(key, group);
        session.groupOrder.push(group);
      }

      var person = {
        first: compact(raw["PrimaryAuthor.FirstName"]),
        last: compact(raw["PrimaryAuthor.LastName"]),
        country: compact(raw["PrimaryAuthor.FirstInstitutionCountry"]),
        institution: compact(raw["PrimaryAuthor.FirstInstitutionName"]),
        role: compact(raw["Abstract.ActivityName"]),
        order: parseInt(raw["Abstract.PresentationRoleOrder"], 10),
        sourceIndex: index,
        control: compact(raw["Abstract.ControlNumber"])
      };
      if (isNaN(person.order)) person.order = 9999;
      person.priority = rolePriority(person.role);
      person.display = formatPerson(person);

      var dedupe = personKey(person);
      if (!group.seenPeople[dedupe] && person.display) {
        group.seenPeople[dedupe] = true;
        group.people.push(person);
      }

      var abstractHtml = redactPrivate(raw["Abstract.Abstract1"] || raw["Abstract.Abstract2"] || "");
      if (stripTags(abstractHtml)) {
        group.abstracts.push({
          control: person.control,
          title: compact(raw["Abstract.Title"]),
          html: abstractHtml,
          person: person
        });
      }
    });

    sessionOrder.forEach(function (session) {
      session.groupOrder.forEach(function (group) {
        group.people.sort(function (a, b) {
          if (a.priority !== b.priority) return a.priority - b.priority;
          if (a.order !== b.order) return a.order - b.order;
          return a.sourceIndex - b.sourceIndex;
        });
        group.showTitle = group.title && !isGenericTitle(group.title);
        group.mixedRoles = new Set(group.people.map(function (p) { return roleGroupLabel(p.role); })).size > 1;
      });
      session.groupOrder.sort(function (a, b) {
        if (a.startMinutes !== b.startMinutes) return a.startMinutes - b.startMinutes;
        return a.sourceIndex - b.sourceIndex;
      });
      session.presentations = session.groupOrder;
      session.chairs = uniqueChairs(session);
      session.search = buildSearch(session);
      delete session.groups;
      delete session.groupOrder;
    });

    sessionOrder.sort(function (a, b) {
      if (a.dateKey === b.dateKey) {
        if (a.startMinutes !== b.startMinutes) return a.startMinutes - b.startMinutes;
        return a.sourceIndex - b.sourceIndex;
      }
      if (!a.dateKey) return 1;
      if (!b.dateKey) return -1;
      if (a.dateKey === "eposter") return 1;
      if (b.dateKey === "eposter") return -1;
      return a.dateKey < b.dateKey ? -1 : 1;
    });

    return sessionOrder;
  }

  function uniqueChairs(session) {
    var seen = {};
    var chairs = [];
    session.groupOrder.forEach(function (group) {
      group.people.forEach(function (person) {
        if (person.priority !== 0) return;
        var key = normalizeTitle(person.first + " " + person.last);
        if (seen[key] || !person.display) return;
        seen[key] = true;
        chairs.push(person);
      });
    });
    return chairs;
  }

  function buildSearch(session) {
    var parts = [session.id, session.title, session.type, session.track, session.dateLabel, session.timeLabel];
    session.presentations.forEach(function (group) {
      parts.push(group.title, group.timeLabel);
      group.people.forEach(function (person) {
        parts.push(person.display, person.first, person.last, person.country, person.institution, person.role);
      });
      group.abstracts.forEach(function (abs) {
        parts.push(abs.title, abs.control, stripTags(abs.html));
      });
    });
    return parts.join(" ").toLowerCase();
  }

  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var list = raw ? JSON.parse(raw) : [];
      var map = {};
      (Array.isArray(list) ? list : []).forEach(function (id) {
        if (id) map[String(id)] = true;
      });
      return map;
    } catch (err) {
      return {};
    }
  }

  function persistSaved() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.keys(state.saved)));
    } catch (err) {
      /* localStorage may be unavailable */
    }
  }

  function defaultDay(sessions, now) {
    var days = uniqueDays(sessions);
    if (isCongressNow(now)) {
      var today = vancouverParts(now).dateKey;
      if (days.indexOf(today) !== -1) return today;
    }
    return days[0] || "";
  }

  function uniqueDays(sessions) {
    var seen = {};
    var days = [];
    sessions.forEach(function (session) {
      var key = session.dateKey || "eposter";
      if (seen[key]) return;
      seen[key] = true;
      days.push(key);
    });
    days.sort(function (a, b) {
      if (a === "eposter") return 1;
      if (b === "eposter") return -1;
      return a < b ? -1 : 1;
    });
    return days;
  }

  function uniqueTypes(sessions) {
    var seen = {};
    var types = [];
    sessions.forEach(function (session) {
      if (!session.type || seen[session.type]) return;
      seen[session.type] = true;
      types.push(session.type);
    });
    types.sort();
    return types;
  }

  function uniqueTracks(sessions) {
    var seen = {};
    var tracks = [];
    sessions.forEach(function (session) {
      if (!session.track || seen[session.track]) return;
      seen[session.track] = true;
      tracks.push(session.track);
    });
    tracks.sort();
    return tracks;
  }

  function sessionStatus(session, now) {
    if (!isCongressNow(now) || !session.dateKey || session.dateKey === "eposter" || !session.range) return "";
    var parts = vancouverParts(now);
    if (parts.dateKey !== session.dateKey) return "";
    if (parts.minutes >= session.startMinutes && parts.minutes < session.endMinutes) return "now";
    var until = session.startMinutes - parts.minutes;
    if (until > 0 && until <= 15) return "soon";
    if (until > 15 && until <= 30) return "next";
    return "";
  }

  function statusLabel(code) {
    if (code === "now") return "Now";
    if (code === "soon") return "Starts in 15 min";
    if (code === "next") return "Next";
    return "";
  }

  function trackClass(track) {
    var value = (track || "").toLowerCase();
    if (value.indexOf("elbow") !== -1) return "track-elbow";
    if (value.indexOf("rotator") !== -1 || value.indexOf("cuff") !== -1) return "track-cuff";
    if (value.indexOf("arthroplasty") !== -1) return "track-arthroplasty";
    if (value.indexOf("instability") !== -1) return "track-instability";
    if (value.indexOf("trauma") !== -1 || value.indexOf("fracture") !== -1) return "track-trauma";
    if (value.indexOf("international") !== -1) return "track-international";
    if (value.indexOf("basic") !== -1) return "track-basic";
    if (value.indexOf("nerve") !== -1) return "track-nerve";
    if (value.indexOf("shoulder") !== -1) return "track-shoulder";
    return "track-other";
  }

  function typeClass(type) {
    var value = (type || "").toLowerCase();
    if (value.indexOf("instructional") !== -1) return "type-icl";
    if (value.indexOf("symposium") !== -1) return "type-symposium";
    if (value.indexOf("eposter") !== -1 || value.indexOf("e-poster") !== -1) return "type-eposter";
    if (value.indexOf("education") !== -1) return "type-education";
    return "";
  }

  function filteredSessions() {
    var query = state.query.trim().toLowerCase();
    return state.sessions.filter(function (session) {
      if (state.myProgramme && !state.saved[session.id]) return false;
      if (!state.myProgramme && !query && state.activeDay && (session.dateKey || "eposter") !== state.activeDay) return false;
      if (state.type && session.type !== state.type) return false;
      if (state.track && session.track !== state.track) return false;
      if (query && session.search.indexOf(query) === -1) return false;
      return true;
    });
  }

  function filtersActive() {
    return !!(state.query.trim() || state.type || state.track);
  }

  function readHash() {
    var hash = (location.hash || "").replace(/^#/, "");
    if (!hash) return { session: "", abstract: "" };
    var params = new URLSearchParams(hash);
    return {
      session: params.get("session") || "",
      abstract: params.get("abstract") || ""
    };
  }

  function writeHash(sessionId, abstractId) {
    var parts = [];
    if (sessionId) parts.push("session=" + encodeURIComponent(sessionId));
    if (abstractId) parts.push("abstract=" + encodeURIComponent(abstractId));
    var next = parts.length ? "#" + parts.join("&") : "";
    if (location.hash !== next) history.replaceState(null, "", next || location.pathname + location.search);
  }

  function programmeUrl(sessionId, abstractId) {
    var base = location.href.split("#")[0];
    var parts = ["session=" + encodeURIComponent(sessionId)];
    if (abstractId) parts.push("abstract=" + encodeURIComponent(abstractId));
    return base + "#" + parts.join("&");
  }

  function icsDate(dateKey, clock) {
    var parts = dateKey.split("-");
    return parts[0] + parts[1] + parts[2] + "T" + pad(clock.hour) + pad(clock.minute) + "00";
  }

  function foldIcs(line) {
    var bytes = new TextEncoder().encode(line);
    if (bytes.length <= 75) return line;
    var out = [];
    var start = 0;
    while (start < bytes.length) {
      var width = start === 0 ? 75 : 74;
      var end = Math.min(start + width, bytes.length);
      while (end > start && (bytes[end] & 0xc0) === 0x80) end -= 1;
      out.push(new TextDecoder().decode(bytes.slice(start, end)));
      start = end;
    }
    return out.join("\r\n ");
  }

  function icsEscape(text) {
    return String(text || "")
      .replace(/\\/g, "\\\\")
      .replace(/\n/g, "\\n")
      .replace(/,/g, "\\,")
      .replace(/;/g, "\\;");
  }

  function buildIcs(session) {
    if (!session.dateKey || session.dateKey === "eposter" || !session.range) return "";
    var start = icsDate(session.dateKey, session.range.start);
    var end = icsDate(session.dateKey, session.range.end);
    var lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//ICSES 2026//Scientific Program//EN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "BEGIN:VTIMEZONE",
      "TZID:America/Vancouver",
      "X-LIC-LOCATION:America/Vancouver",
      "BEGIN:DAYLIGHT",
      "TZOFFSETFROM:-0800",
      "TZOFFSETTO:-0700",
      "TZNAME:PDT",
      "DTSTART:19700308T020000",
      "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU",
      "END:DAYLIGHT",
      "BEGIN:STANDARD",
      "TZOFFSETFROM:-0700",
      "TZOFFSETTO:-0800",
      "TZNAME:PST",
      "DTSTART:19701101T020000",
      "RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU",
      "END:STANDARD",
      "END:VTIMEZONE",
      "BEGIN:VEVENT",
      "UID:icses2026-session-" + session.id + "@icses2026.org",
      "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z"),
      "DTSTART;TZID=America/Vancouver:" + start,
      "DTEND;TZID=America/Vancouver:" + end,
      foldIcs("SUMMARY:" + icsEscape(session.title + " — " + CONGRESS_NAME)),
      foldIcs("LOCATION:" + icsEscape(VENUE)),
      foldIcs("DESCRIPTION:" + icsEscape(session.type + "\nSession " + session.id + "\n" + programmeUrl(session.id))),
      foldIcs("URL:" + programmeUrl(session.id)),
      "END:VEVENT",
      "END:VCALENDAR"
    ];
    return lines.join("\r\n");
  }

  function googleCalendarUrl(session) {
    if (!session.dateKey || session.dateKey === "eposter" || !session.range) return "";
    var start = icsDate(session.dateKey, session.range.start);
    var end = icsDate(session.dateKey, session.range.end);
    var params = new URLSearchParams({
      action: "TEMPLATE",
      text: session.title + " — " + CONGRESS_NAME,
      dates: start + "/" + end,
      ctz: TZ,
      location: VENUE,
      details: session.type + "\nSession " + session.id + "\n" + programmeUrl(session.id)
    });
    return "https://calendar.google.com/calendar/render?" + params.toString();
  }

  function downloadIcs(session) {
    var ics = buildIcs(session);
    if (!ics) return;
    var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "ICSES2026-session-" + session.id + ".ics";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function renderDays() {
    var html = state.days.map(function (day) {
      var active = !state.myProgramme && state.activeDay === day;
      return (
        '<button type="button" class="day' + (active ? " active" : "") + '" role="tab" data-day="' +
        esc(day) + '" aria-selected="' + (active ? "true" : "false") + '">' +
        esc(formatDayLabel(day)) + "</button>"
      );
    }).join("");
    html +=
      '<button type="button" class="day' + (state.myProgramme ? " active" : "") +
      '" role="tab" data-mypgm="1" aria-selected="' + (state.myProgramme ? "true" : "false") +
      '">My Program</button>';
    qs("days").innerHTML = html;
  }

  function renderTypes() {
    var select = qs("type");
    var current = select.value;
    select.innerHTML = '<option value="">All session types</option>' +
      state.types.map(function (type) {
        return "<option>" + esc(type) + "</option>";
      }).join("");
    if (current && state.types.indexOf(current) !== -1) select.value = current;
  }

  function renderTracks() {
    var select = qs("track");
    if (!select) return;
    var current = select.value;
    select.innerHTML = '<option value="">All tracks</option>' +
      state.tracks.map(function (track) {
        return "<option>" + esc(track) + "</option>";
      }).join("");
    if (current && state.tracks.indexOf(current) !== -1) select.value = current;
  }

  function renderFaculty(group) {
    if (!group.people.length) return "";
    var mixed = group.mixedRoles;
    var html = '<ul class="faculty' + (mixed ? "" : " faculty-inline") + '">';
    var lastLabel = "";
    group.people.forEach(function (person) {
      if (mixed) {
        var label = roleGroupLabel(person.role);
        if (label !== lastLabel) {
          html += '<li class="role-label">' + esc(label) + "</li>";
          lastLabel = label;
        }
      }
      html += "<li>" + highlight(person.display, state.query) + "</li>";
    });
    html += "</ul>";
    return html;
  }

  function renderPresentation(group) {
    var abstracts = group.abstracts.map(function (abs) {
      return (
        '<button type="button" class="abs-btn" data-abstract="' + esc(abs.control) +
        '">View abstract</button>'
      );
    }).join("");
    return (
      '<article class="presentation">' +
        '<div class="pres-time">' + esc(group.timeLabel) + "</div>" +
        "<div>" +
          (group.showTitle ? '<div class="pres-title">' + highlight(group.title, state.query) + "</div>" : "") +
          renderFaculty(group) +
          (abstracts ? '<div class="pres-foot">' + abstracts + "</div>" : "") +
        "</div>" +
      "</article>"
    );
  }

  function renderActions(session) {
    var saved = !!state.saved[session.id];
    var cal = "";
    if (session.range && session.dateKey && session.dateKey !== "eposter") {
      cal =
        '<div class="cal-menu">' +
          '<button type="button" class="ghost-btn" data-cal-toggle="' + esc(session.id) + '" aria-expanded="false">Add to calendar</button>' +
          '<div class="cal-pop" hidden>' +
            '<a href="' + esc(googleCalendarUrl(session)) + '" rel="noopener noreferrer" target="_blank">Google Calendar</a>' +
            '<button type="button" data-ics="' + esc(session.id) + '">Apple / Outlook (.ics)</button>' +
          "</div>" +
        "</div>";
    }
    return (
      '<div class="session-actions">' +
        '<button type="button" class="ghost-btn" data-save="' + esc(session.id) + '" aria-pressed="' +
        (saved ? "true" : "false") + '">' + (saved ? "Saved" : "Save session") + "</button>" +
        cal +
        '<button type="button" class="text-btn" data-copy="' + esc(session.id) + '">Copy link</button>' +
      "</div>"
    );
  }

  function renderSession(session, now) {
    var open = !!state.open[session.id];
    var status = sessionStatus(session, now);
    var chairs = session.chairs.map(function (person) { return person.display; }).join(" · ");
    var count = session.presentations.length;
    var badge = status
      ? '<span class="status-badge' + (status === "now" ? " now" : "") + '">' + esc(statusLabel(status)) + "</span>"
      : "";
    return (
      '<article class="session' + (open ? " open" : "") + '" id="session-' + esc(session.id) + '" data-session="' + esc(session.id) + '">' +
        '<button type="button" class="session-head" aria-expanded="' + (open ? "true" : "false") + '" data-toggle="' + esc(session.id) + '">' +
          '<div class="session-time">' + esc(session.timeLabel || (session.dateKey === "eposter" ? "ePoster" : session.dateLabel)) + "</div>" +
          "<div>" +
            '<div class="session-kicker">' +
              '<div class="session-type ' + typeClass(session.type) + '">' + esc(session.type) + "</div>" +
              (session.track ? '<div class="session-track ' + trackClass(session.track) + '">' + highlight(session.track, state.query) + "</div>" : "") +
            "</div>" +
            "<h2>" + highlight(session.title, state.query) + "</h2>" +
            '<p class="session-meta">Session ' + highlight(session.id, state.query) +
              (session.dateLabel && session.dateKey !== "eposter" ? " · " + esc(session.dateLabel) : "") +
              " · " + count + " presentation" + (count === 1 ? "" : "s") + "</p>" +
            (chairs ? '<p class="chairs">Moderator' + (session.chairs.length > 1 ? "s" : "") + ": " + esc(chairs) + "</p>" : "") +
            (badge ? '<div class="badges">' + badge + "</div>" : "") +
          "</div>" +
          '<span class="chev" aria-hidden="true">⌄</span>' +
        "</button>" +
        '<div class="session-body">' +
          renderActions(session) +
          session.presentations.map(renderPresentation).join("") +
        "</div>" +
      "</article>"
    );
  }

  function render(keepScroll) {
    var y = keepScroll ? window.scrollY : null;
    var now = new Date();
    if (state.sessions.length) hideLoading();
    var rows = filteredSessions();
    qs("clear-filters").hidden = !filtersActive();

    var viewNote = qs("view-note");
    if (state.myProgramme) {
      viewNote.hidden = false;
      viewNote.textContent = "My Program is saved in this browser on this device. It is not synced across phones or computers.";
    } else {
      viewNote.hidden = true;
      viewNote.textContent = "";
    }

    var summary = rows.length + " session" + (rows.length === 1 ? "" : "s");
    var query = state.query.trim();
    if (state.myProgramme) summary += " in My Program";
    else if (query) summary += " across all days";
    else if (state.activeDay) summary += " · " + formatDayFull(state.activeDay);
    qs("summary").textContent = summary;

    if (!rows.length) {
      var message = state.myProgramme && !filtersActive()
        ? "<h2>No saved sessions yet</h2><p>Save a session to build a personal program for this device.</p>"
        : "<h2>No sessions match your search.</h2><p>Try another name, session title, or topic.</p>";
      var action = filtersActive()
        ? '<button type="button" class="primary-btn" id="empty-clear">Clear filters</button>'
        : state.myProgramme
          ? '<button type="button" class="primary-btn" id="empty-all">Browse program</button>'
          : "";
      qs("list").innerHTML = '<div class="empty">' + message + action + "</div>";
    } else if (query && !state.myProgramme) {
      var html = "";
      var lastDay = null;
      rows.forEach(function (session) {
        var dayKey = session.dateKey || "eposter";
        if (dayKey !== lastDay) {
          html += '<h3 class="day-heading">' + esc(formatDayFull(dayKey)) + "</h3>";
          lastDay = dayKey;
        }
        html += renderSession(session, now);
      });
      qs("list").innerHTML = html;
    } else {
      qs("list").innerHTML = rows.map(function (session) {
        return renderSession(session, now);
      }).join("");
    }

    renderDays();
    renderLoadStatus();
    if (y != null) window.scrollTo(0, y);
  }

  function renderLoadStatus() {
    var el = qs("load-status");
    if (!state.loadedAt) {
      el.hidden = true;
      return;
    }
    var time = state.loadedAt.toLocaleTimeString("en-US", {
      timeZone: TZ,
      hour: "numeric",
      minute: "2-digit"
    });
    el.hidden = false;
    el.textContent = "Program loaded at " + time + " PT";
  }

  function findSession(id) {
    for (var i = 0; i < state.sessions.length; i += 1) {
      if (state.sessions[i].id === id) return state.sessions[i];
    }
    return null;
  }

  function findAbstract(control) {
    for (var i = 0; i < state.sessions.length; i += 1) {
      var session = state.sessions[i];
      for (var j = 0; j < session.presentations.length; j += 1) {
        var group = session.presentations[j];
        for (var k = 0; k < group.abstracts.length; k += 1) {
          if (group.abstracts[k].control === control) {
            return { session: session, group: group, abstract: group.abstracts[k] };
          }
        }
      }
    }
    return null;
  }

  function toggleSession(id, open) {
    var session = findSession(id);
    if (!session) return;
    if (open == null) open = !state.open[id];
    if (open) state.open[id] = true;
    else delete state.open[id];
    writeHash(open ? id : "", "");
    render(true);
    if (open) {
      var el = qs("session-" + id);
      if (el) el.scrollIntoView({ block: "nearest" });
    }
  }

  function showAbstract(control) {
    var found = findAbstract(control);
    if (!found) return;
    state.open[found.session.id] = true;
    writeHash(found.session.id, control);
    var authors = found.group.people.map(function (person) {
      var line = esc(person.display);
      if (person.institution) line += " \u2014 " + esc(person.institution);
      return line;
    }).join("<br>");
    qs("abstract").innerHTML =
      '<p class="session-type">Abstract ' + esc(found.abstract.control) + "</p>" +
      '<h2 id="abstract-title">' + esc(found.abstract.title || found.group.title) + "</h2>" +
      '<div class="abstract-meta">' + authors +
        "<br><br>" + esc(found.session.title) +
        (found.group.timeLabel ? " · " + esc(found.group.timeLabel) : "") +
      "</div>" +
      '<div class="abstract-body">' + sanitizeHtml(found.abstract.html) + "</div>";
    var modal = qs("modal");
    modal.hidden = false;
    state.lastFocus = document.activeElement;
    qs("modal-close").focus();
  }

  function closeModal() {
    qs("modal").hidden = true;
    qs("abstract").innerHTML = "";
    var hash = readHash();
    writeHash(hash.session, "");
    if (state.lastFocus && state.lastFocus.focus) state.lastFocus.focus();
  }

  function showLightbox(src, caption) {
    qs("lightbox-img").src = src;
    qs("lightbox-img").alt = caption || "Abstract figure";
    qs("lightbox-caption").textContent = caption || "";
    qs("lightbox").hidden = false;
    qs("lightbox-close").focus();
  }

  function closeLightbox() {
    qs("lightbox").hidden = true;
    qs("lightbox-img").removeAttribute("src");
  }

  function closeCalendars() {
    document.querySelectorAll(".cal-menu.open").forEach(function (menu) {
      menu.classList.remove("open");
      var toggle = menu.querySelector("[data-cal-toggle]");
      var pop = menu.querySelector(".cal-pop");
      if (toggle) toggle.setAttribute("aria-expanded", "false");
      if (pop) pop.hidden = true;
    });
  }

  function copyLink(sessionId) {
    var url = programmeUrl(sessionId);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).catch(function () {
        window.prompt("Copy this program link", url);
      });
    } else {
      window.prompt("Copy this program link", url);
    }
  }

  function clearFilters() {
    state.query = "";
    state.type = "";
    state.track = "";
    qs("q").value = "";
    qs("type").value = "";
    if (qs("track")) qs("track").value = "";
    render();
  }

  function applyHash() {
    var hash = readHash();
    if (hash.session) {
      var session = findSession(hash.session);
      if (session) {
        state.myProgramme = false;
        state.open[session.id] = true;
        state.activeDay = session.dateKey || "eposter";
        render();
        var el = qs("session-" + session.id);
        if (el) el.scrollIntoView({ block: "start" });
      }
    }
    if (hash.abstract) showAbstract(hash.abstract);
  }

  function bind() {
    qs("search-form").addEventListener("submit", function (event) {
      event.preventDefault();
    });

    var searchTimer = null;
    qs("q").addEventListener("input", function (event) {
      var value = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.query = value;
        render(true);
      }, 120);
    });

    qs("type").addEventListener("change", function (event) {
      state.type = event.target.value;
      render(true);
    });

    if (qs("track")) {
      qs("track").addEventListener("change", function (event) {
        state.track = event.target.value;
        render(true);
      });
    }

    qs("clear-filters").addEventListener("click", clearFilters);

    qs("days").addEventListener("click", function (event) {
      var btn = event.target.closest("button");
      if (!btn) return;
      if (btn.getAttribute("data-mypgm")) {
        state.myProgramme = true;
        render();
        return;
      }
      var day = btn.getAttribute("data-day");
      if (!day) return;
      state.myProgramme = false;
      state.activeDay = day;
      render();
      window.scrollTo({ top: qs("programme").offsetTop - 8, behavior: "smooth" });
    });

    qs("list").addEventListener("click", function (event) {
      var emptyClear = event.target.closest("#empty-clear");
      if (emptyClear) { clearFilters(); return; }
      var emptyAll = event.target.closest("#empty-all");
      if (emptyAll) {
        state.myProgramme = false;
        render();
        return;
      }

      var toggle = event.target.closest("[data-toggle]");
      if (toggle) {
        toggleSession(toggle.getAttribute("data-toggle"));
        return;
      }

      var save = event.target.closest("[data-save]");
      if (save) {
        var sid = save.getAttribute("data-save");
        if (state.saved[sid]) delete state.saved[sid];
        else state.saved[sid] = true;
        persistSaved();
        render(true);
        return;
      }

      var copy = event.target.closest("[data-copy]");
      if (copy) {
        copyLink(copy.getAttribute("data-copy"));
        copy.textContent = "Link copied";
        setTimeout(function () { copy.textContent = "Copy link"; }, 1600);
        return;
      }

      var ics = event.target.closest("[data-ics]");
      if (ics) {
        var session = findSession(ics.getAttribute("data-ics"));
        if (session) downloadIcs(session);
        closeCalendars();
        return;
      }

      var cal = event.target.closest("[data-cal-toggle]");
      if (cal) {
        var menu = cal.parentElement;
        var open = !menu.classList.contains("open");
        closeCalendars();
        if (open) {
          menu.classList.add("open");
          cal.setAttribute("aria-expanded", "true");
          menu.querySelector(".cal-pop").hidden = false;
        }
        return;
      }

      var abs = event.target.closest("[data-abstract]");
      if (abs) {
        showAbstract(abs.getAttribute("data-abstract"));
      }
    });

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".cal-menu")) closeCalendars();
    });

    qs("modal").addEventListener("click", function (event) {
      if (event.target === qs("modal")) closeModal();
      var img = event.target.closest(".abstract-body img");
      if (img) showLightbox(img.getAttribute("src"), img.getAttribute("title") || img.getAttribute("alt"));
    });
    qs("modal-close").addEventListener("click", closeModal);
    qs("lightbox-close").addEventListener("click", closeLightbox);
    qs("lightbox").addEventListener("click", function (event) {
      if (event.target.id === "lightbox") closeLightbox();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        if (!qs("lightbox").hidden) closeLightbox();
        else if (!qs("modal").hidden) closeModal();
        else closeCalendars();
      }
    });

    window.addEventListener("hashchange", applyHash);
  }

  function publicizeError() {
    hideLoading();
    qs("list").innerHTML =
      '<div class="empty"><h2>The program could not be loaded.</h2>' +
      "<p>Please refresh the page. If the problem continues, try again shortly.</p></div>";
  }

  function embeddedBackup() {
    if (typeof window.ICSES_BACKUP_CSV === "string" && window.ICSES_BACKUP_CSV.length > 80) {
      return window.ICSES_BACKUP_CSV;
    }
    return "";
  }

  async function fetchText(url, timeoutMs) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs || 8000);
    try {
      var response = await fetch(url, { cache: "no-store", signal: controller.signal });
      if (!response.ok) throw new Error("fetch");
      var text = await response.text();
      if (!text || text.length < 80) throw new Error("empty");
      if (/^\s*</.test(text)) throw new Error("html");
      return text;
    } finally {
      clearTimeout(timer);
    }
  }

  function boot(loaded) {
    if (!window.ICSESCsv || !window.ICSESCsv.parse) throw new Error("parser");
    var firstLoad = !state.sessions.length;
    var rows = window.ICSESCsv.parse(loaded.text);
    rows.forEach(function (row) {
      Object.keys(row).forEach(function (key) {
        if (typeof row[key] === "string") row[key] = redactPrivate(row[key]);
      });
    });
    var previousDay = state.activeDay;
    state.sessions = transform(rows);
    rows.forEach(function (row) {
      Object.keys(PRIVATE_HEADERS).forEach(function (key) {
        if (key in row) delete row[key];
      });
    });
    state.days = uniqueDays(state.sessions);
    state.types = uniqueTypes(state.sessions);
    state.tracks = uniqueTracks(state.sessions);
    state.source = "live";
    state.loadedAt = new Date();
    if (!previousDay || state.days.indexOf(previousDay) === -1) {
      state.activeDay = defaultDay(state.sessions, state.loadedAt);
    }
    renderTypes();
    renderTracks();
    hideLoading();
    render();
    if (firstLoad) applyHash();
  }

  async function start() {
    try {
      bind();
      state.saved = loadSaved();
      var embedded = embeddedBackup();
      if (embedded) {
        try { boot({ text: embedded, source: "backup" }); } catch (err) {}
      } else {
        showLoading();
      }
      try {
        boot({ text: await fetchText(LIVE_CSV, 8000), source: "live" });
      } catch (err) {
        if (!state.sessions.length) publicizeError();
      }
    } catch (err) {
      if (!state.sessions.length) publicizeError();
    } finally {
      hideLoading();
    }
  }

  start();
})();

</script>
</body>
</html>
